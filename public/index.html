<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatixAI Mail</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  padding:20px;background:#0b0c10;color:#fff;
  font-family:Arial,sans-serif;
  background-image:radial-gradient(ellipse at 20% 10%,#6f42c155,transparent 45%),
  radial-gradient(ellipse at 90% 90%,#00f2fe22,transparent 40%);
}
.card{
  width:100%;max-width:570px;padding:38px;
  border:1px solid #ffffff20;border-radius:22px;
  background:#151922eF;box-shadow:0 25px 80px #0008;
  text-align:center;
}
.logo{font-size:34px;font-weight:800;letter-spacing:-1px}
.logo span{color:#00f2fe}
.tag{color:#b9c0cf;line-height:1.7;margin:18px 0 28px}
form{display:flex;gap:10px}
input,button{font:inherit;border-radius:10px;padding:14px}
input{
  flex:1;min-width:0;color:#fff;background:#0b0c10;
  border:1px solid #394152;outline:none;
}
input:focus{border-color:#00f2fe}
button{
  border:0;color:#fff;font-weight:bold;cursor:pointer;
  background:linear-gradient(135deg,#6f42c1,#007e95);
}
button:disabled{opacity:.6;cursor:wait}
#message{margin-top:18px;line-height:1.6;font-size:14px}
footer{margin-top:30px;color:#929bad;font-size:12px}
@media(max-width:480px){
  .card{padding:25px 18px}
  form{flex-direction:column}
  button{width:100%}
}
</style>
</head>
<body>
<main class="card">
  <div class="logo">Chatix<span>AI</span></div>
  <p class="tag">
    ChatixAI güncellemeleri, yenilikleri ve duyurularından
    ilk sen haberdar ol.
  </p>

  <form id="subscribeForm">
    <input id="emailInput" type="email"
      placeholder="E-posta adresin" autocomplete="email"
      maxlength="254" required>
    <button id="submitBtn" type="submit">Beni Bilgilendir</button>
  </form>

  <div id="message" role="status" aria-live="polite"></div>
  <footer>© 2026 ChatixAI. Tüm hakları saklıdır.</footer>
</main>

<script>
const form = document.getElementById('subscribeForm');
const emailInput = document.getElementById('emailInput');
const submitBtn = document.getElementById('submitBtn');
const message = document.getElementById('message');

form.addEventListener('submit', async event => {
  event.preventDefault();

  submitBtn.disabled = true;
  submitBtn.textContent = 'Gönderiliyor...';
  message.style.color = '#b9c0cf';
  message.textContent = 'Kaydın oluşturuluyor...';

  try {
    const response = await fetch('/api/subscribe', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: emailInput.value.trim()
      })
    });

    const data = await response.json();

    message.style.color = data.success ? '#00f2fe' : '#ff7777';
    message.textContent = data.message || 'İşlem tamamlanamadı.';

    if (data.success) emailInput.value = '';
  } catch {
    message.style.color = '#ff7777';
    message.textContent = 'Sunucuya bağlanılamadı. Lütfen tekrar dene.';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Beni Bilgilendir';
  }
});
</script>
</body>
</html>
