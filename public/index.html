<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatixAI | Yapay Zeka Destekli Bülten Ekosistemi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1f2833;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #00f2fe;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 18px;
            color: #c5c6c7;
            margin-bottom: 30px;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="email"] {
            flex: 1;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #0b0c10;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="email"]:focus {
            border-color: #00f2fe;
        }
        button {
            padding: 14px 28px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #6f42c1, #00f2fe);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        #message {
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #8c8f94;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo"><i class="fa-solid fa-brain"></i> ChatixAI</div>
        <p class="subtitle">Yeni model güncellemelerinden ve yapay zeka bültenlerinden ilk senin haberin olsun!</p>
        
        <form id="subscribeForm">
            <div class="form-group">
                <input type="email" id="emailInput" placeholder="E-posta adresinizi girin..." required>
                <button type="submit" id="submitBtn">Kayıt Ol</button>
            </div>
        </form>

        <div id="message"></div>
        <div class="footer">© 2026 ChatixAI. Tüm hakları saklıdır.</div>
    </div>

    <script>
        const form = document.getElementById('subscribeForm');
        const emailInput = document.getElementById('emailInput');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Gönderiliyor...';
            messageDiv.style.color = '#c5c6c7';
            messageDiv.textContent = 'Kayıt oluşturuluyor...';

            try {
                const response = await fetch('/api/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    messageDiv.style.color = '#00f2fe';
                    messageDiv.textContent = data.message || 'Harika! Kaydınız başarıyla oluşturuldu.';
                    emailInput.value = '';
                } else {
                    messageDiv.style.color = '#ff4d4d';
                    messageDiv.textContent = data.message || 'Bir hata oluştu.';
                }
            } catch (err) {
                messageDiv.style.color = '#ff4d4d';
                messageDiv.textContent = 'Sunucuya bağlanırken bir hata oluştu.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Kayıt Ol';
            }
        });
    </script>
</body>
</html>
