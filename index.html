<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatixAI - Geleceğin Yapay Zeka Platformu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    .glow-1 {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(111,66,193,0.4) 0%, rgba(0,0,0,0) 70%);
      top: 5%;
      left: 10%;
      filter: blur(90px);
      z-index: 1;
      animation: pulseGlow 8s infinite alternate;
    }

    .glow-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0,242,254,0.3) 0%, rgba(0,0,0,0) 70%);
      bottom: 5%;
      right: 10%;
      filter: blur(90px);
      z-index: 1;
      animation: pulseGlow 10s infinite alternate-reverse;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 680px;
      width: 90%;
      padding: 60px 45px;
      background: rgba(31, 40, 51, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(111, 66, 193, 0.25);
      border: 1px solid rgba(111, 66, 193, 0.6);
      color: #00f2fe;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 28px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(111,66,193,0.2);
    }

    h1 {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #ffffff 30%, #c5c6c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.15;
      letter-spacing: -1px;
    }

    p {
      color: #c5c6c7;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 40px;
      font-weight: 400;
    }

    .form-group {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      min-width: 280px;
    }

    .input-wrapper i {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #8c8f94;
      font-size: 18px;
      pointer-events: none;
      transition: color 0.3s;
    }

    input[type="email"] {
      width: 100%;
      padding: 18px 20px 18px 52px;
      background: rgba(11, 12, 16, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="email"]::placeholder {
      color: #6c757d;
    }

    input[type="email"]:focus {
      border-color: #00f2fe;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
    }

    input[type="email"]:focus ~ i,
    .input-wrapper:focus-within i {
      color: #00f2fe;
    }

    button {
      padding: 18px 36px;
      background: linear-gradient(135deg, #6f42c1, #00f2fe);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(111,66,193,0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #message {
      margin-top: 24px;
      font-size: 14px;
      padding: 14px;
      border-radius: 10px;
      display: none;
      font-weight: 500;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-success {
      background: rgba(40, 167, 69, 0.15);
      border: 1px solid rgba(40, 167, 69, 0.4);
      color: #2ecc71;
    }

    .msg-error {
      background: rgba(220, 53, 69, 0.15);
      border: 1px solid rgba(220, 53, 69, 0.4);
      color: #e74c3c;
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <div class="badge">
      <i class="fa-solid fa-sparkles" style="color: #00f2fe;"></i> ChatixAI Erken Erişim
    </div>
    <h1>Yapay Zekanın Gücünü Deneyimleyin</h1>
    <p>ChatixAI ekosistemindeki son model güncellemelerinden, yeni özelliklerden ve duyurulardan ilk siz haberdar olun.</p>

    <form id="subscribeForm" class="form-group">
      <div class="input-wrapper">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" id="emailInput" placeholder="E-posta adresinizi girin..." required>
      </div>
      <button type="submit" id="submitBtn">Beni Bilgilendir</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    const form = document.getElementById('subscribeForm');
    const emailInput = document.getElementById('emailInput');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();

      if (!email) return;

      submitBtn.disabled = true;
      submitBtn.innerText = 'Gönderiliyor...';
      messageDiv.style.display = 'none';

      try {
        const response = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        messageDiv.style.display = 'block';
        if (data.success) {
          messageDiv.className = 'msg-success';
          messageDiv.innerText = data.message;
          emailInput.value = '';
        } else {
          messageDiv.className = 'msg-error';
          messageDiv.innerText = data.message || 'Bir hata oluştu.';
        }
      } catch (err) {
        messageDiv.style.display = 'block';
        messageDiv.className = 'msg-error';
        messageDiv.innerText = 'Bağlantı hatası oluştu. Lütfen tekrar deneyin.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Beni Bilgilendir';
      }
    });
  </script>
</body>
</html>
