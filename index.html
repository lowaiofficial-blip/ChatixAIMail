<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatixAI - Geleceğin Yapay Zeka Platformu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    .glow-1 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(111,66,193,0.35) 0%, rgba(0,0,0,0) 70%);
      top: 10%;
      left: 15%;
      filter: blur(80px);
      z-index: 1;
    }

    .glow-2 {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(0,242,254,0.25) 0%, rgba(0,0,0,0) 70%);
      bottom: 10%;
      right: 15%;
      filter: blur(80px);
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 650px;
      width: 90%;
      padding: 50px 40px;
      background: rgba(31, 40, 51, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(111, 66, 193, 0.2);
      border: 1px solid #6f42c1;
      color: #00f2fe;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 0%, #c5c6c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    p {
      color: #c5c6c7;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .form-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .input-wrapper svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      fill: #8c8f94;
      pointer-events: none;
      transition: fill 0.3s;
    }

    input[type="email"] {
      width: 100%;
      padding: 16px 20px 16px 48px;
      background: rgba(11, 12, 16, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="email"]:focus {
      border-color: #00f2fe;
    }

    input[type="email"]:focus + svg,
    .input-wrapper:focus-within svg {
      fill: #00f2fe;
    }

    button {
      padding: 16px 32px;
      background: linear-gradient(135deg, #6f42c1, #00f2fe);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #message {
      margin-top: 20px;
      font-size: 14px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .msg-success {
      background: rgba(40, 167, 69, 0.2);
      border: 1px solid #28a745;
      color: #28a745;
    }

    .msg-error {
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid #dc3545;
      color: #dc3545;
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <div class="badge">ChatixAI Erken Erişim</div>
    <h1>Yapay Zekanın Gücünü Deneyimleyin</h1>
    <p>ChatixAI ekosistemindeki son model güncellemelerinden, yeni özelliklerden ve duyurulardan ilk siz haberdar olun.</p>

    <form id="subscribeForm" class="form-group">
      <div class="input-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-2V6l8 5 8-2v2z"/>
        </svg>
        <input type="email" id="emailInput" placeholder="E-posta adresinizi girin..." required>
      </div>
      <button type="submit" id="submitBtn">Beni Bilgilendir</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    const form = document.getElementById('subscribeForm');
    const emailInput = document.getElementById('emailInput');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();

      if (!email) return;

      submitBtn.disabled = true;
      submitBtn.innerText = 'Gönderiliyor...';
      messageDiv.style.display = 'none';

      try {
        const response = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        messageDiv.style.display = 'block';
        if (data.success) {
          messageDiv.className = 'msg-success';
          messageDiv.innerText = data.message;
          emailInput.value = '';
        } else {
          messageDiv.className = 'msg-error';
          messageDiv.innerText = data.message || 'Bir hata oluştu.';
        }
      } catch (err) {
        messageDiv.style.display = 'block';
        messageDiv.className = 'msg-error';
        messageDiv.innerText = 'Bağlantı hatası oluştu. Lütfen tekrar deneyin.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Beni Bilgilendir';
      }
    });
  </script>
</body>
</html>
